<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecHome</title>
<meta name="description" content="Email confirmed — SecHome.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -960 960 960'%3E%3Cpath fill='%2300E676' d='M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .success-wrap { min-height: 62vh; display: flex; align-items: center; justify-content: center; padding: 48px 0; }
  .success-card {
    max-width: 460px; width: 100%; text-align: center;
    background: var(--card, #11161f); border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px; padding: 40px 28px;
  }
  .success-check {
    width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,230,118,.12); border: 2px solid #00E676;
  }
  .success-check svg { width: 46px; height: 46px; }
  .success-card h1 { font-size: 1.6rem; margin: 0 0 12px; }
  .success-card p.msg { color: var(--muted); font-size: 1.05rem; line-height: 1.5; margin: 0 0 18px; }
  .success-card p.hint { color: var(--muted); font-size: .9rem; opacity: .8; margin: 0; }
</style>
</head>
<body>

<header class="site"><div class="wrap nav">
  <a class="logo" href="index.html">
    <svg viewBox="0 -960 960 960" fill="#00E676" aria-hidden="true"><path d="M480-80q-139-35-229.5-159.5T160-516v-244l320-120 320 120v244q0 152-90.5 276.5T480-80Zm0-499L256-405q19 63 56 114.5t88 86.5v-156h160v156q51-35 88-86.5T704-405L480-579Zm0-216-240 90v189q0 5 .5 11t.5 11l239-186 239 186q0-5 .5-11t.5-11v-189l-240-90Z"/></svg>
    <b>SecHome</b>
  </a>
  <div class="langbox">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>
    <select id="langSel" aria-label="Language"></select>
  </div>
</div></header>

<main><div class="wrap">
  <div class="success-wrap">
    <div class="success-card">
      <div class="success-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 data-i18n="rs_title">You're all set!</h1>
      <p class="msg" data-i18n="rs_msg">Your email has been confirmed. Open the SecHome app and sign in to continue.</p>
      <p class="hint" data-i18n="rs_hint">You can close this tab.</p>
    </div>
  </div>
</div></main>

<footer class="site"><div class="wrap">
  <div class="foot-bottom">
    <span>© <span data-year>2026</span> SecHome · <span data-i18n="footer_rights">All rights reserved.</span></span>
  </div>
</div></footer>
